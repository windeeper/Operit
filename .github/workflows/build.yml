name: Build Operit FullDebug
on:
  workflow_dispatch: # 手动触发，网页点按钮编译
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build FullDebug APK
        run: ./gradlew assembleFullDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Operit-full-debug
          path: app/build/outputs/apk/fullDebug/app-full-debug.apk
